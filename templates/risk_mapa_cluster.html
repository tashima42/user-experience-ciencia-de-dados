<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risk Map Dashboard (Clustered)</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      overflow: hidden;
    }

    /* ============== HEADER ============== */
    header {
      width: 100%;
      background: #000;
      color: #fff;
      padding: 20px 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 80px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
    }

    .btn-nav {
      color: #000;
      background: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn-nav:hover {
      background: #e0e0e0;
    }

    /* ============== MAIN CONTENT ============== */
    .container {
      display: flex;
      height: calc(100vh - 80px);
      width: 100%;
    }

    .map-container {
      flex: 0 0 70%;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .info-panel {
      flex: 0 0 30%;
      height: 100%;
      background: #fff;
      border-left: 1px solid #ddd;
      overflow-y: auto;
      padding: 24px;
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.05);
    }

    .info-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #000;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .empty-state {
      text-align: center;
      color: #999;
      margin-top: 50px;
      font-size: 15px;
    }

    .info-list {
      list-style: none;
    }

    .info-list li {
      margin-bottom: 16px;
      background: #f9f9f9;
      padding: 12px 16px;
      border-radius: 4px;
      border-left: 4px solid #ccc;
    }

    .info-list li strong {
      display: block;
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .info-list li span {
      font-size: 15px;
      font-weight: 500;
      color: #111;
      word-break: break-word;
    }

    /* Legend */
    .legend {
      position: absolute;
      bottom: 30px;
      right: 20px;
      background: white;
      padding: 12px 16px;
      border-radius: 4px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.2);
      z-index: 1000;
    }

    .legend-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .legend-item:last-child {
      margin-bottom: 0;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-right: 10px;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.8);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #333;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #ddd;
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Style Toggle Button */
    .style-toggle {
      position: absolute;
      top: 100px;
      right: 10px;
      z-index: 1000;
      background: white;
      border: none;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
      width: 30px;
      height: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #333;
      transition: all 0.2s;
    }

    .style-toggle:hover {
      background: #f8f8f8;
      transform: scale(1.05);
    }

    .style-toggle.active {
      background: #000;
      color: #fff;
    }
  </style>
</head>

<body>
  <header>
    <h1>Mapa de Risco (Agrupado) ({{ period }})</h1>
    <a href="/" class="btn-nav">Dashboard Direto</a>
  </header>

  <div class="container">
    <div class="map-container">
      <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <div>Carregando pontos no mapa...</div>
      </div>
      <button class="style-toggle" id="style-toggle" title="Alternar Mapa Base">🗺️</button>
      <div id="map"></div>
      <div class="legend">
        <div class="legend-title">Nível de Risco (Prob. Atraso)</div>
        <div class="legend-item">
          <div class="legend-color" style="background:#2ECC71;"></div>
          Verde (&lt; 30%)
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background:#F1C40F;"></div>
          Amarelo (30 - 70%)
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background:#E74C3C;"></div>
          Vermelho (&gt; 70%)
        </div>
      </div>
    </div>

    <div class="info-panel" id="info-panel">
      <h2 class="info-title">Detalhes do Pedido</h2>
      <div class="empty-state">
        <p>Clique em um ponto no mapa para visualizar as informações completas.</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script>
    // Initialize MapLibre Map
    const STYLES = {
      light: [
        'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
        'https://b.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png',
        'https://c.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'
      ],
      osm: [
        'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
        'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
        'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
      ]
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        'version': 8,
        'glyphs': 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        'sources': {
          'osm': {
            'type': 'raster',
            'tiles': STYLES.light, // Default to Light Gray
            'tileSize': 256,
            'attribution': '&copy; <a href="https://carto.com/attributions">CARTO</a>'
          }
        },
        'layers': [
          {
            'id': 'osm',
            'type': 'raster',
            'source': 'osm',
            'minzoom': 0,
            'maxzoom': 19
          }
        ]
      },
      // center: [-51.9253, -14.2350], // Approximate center of Brazil
      // zoom: 3.5
      //center: [-51.9253, -14.2350], // Approximate center of Brazil      
      //zoom: 3.5
      center: [-49.2676, -25.4284], // Curitiba
      zoom: 8
    });

    map.addControl(new maplibregl.NavigationControl());

    // Style Toggle Logic
    let currentStyle = 'light';
    const styleBtn = document.getElementById('style-toggle');
    styleBtn.addEventListener('click', () => {
      currentStyle = currentStyle === 'light' ? 'osm' : 'light';

      map.removeLayer('osm');
      map.removeSource('osm');

      map.addSource('osm', {
        'type': 'raster',
        'tiles': STYLES[currentStyle],
        'tileSize': 256,
        'attribution': currentStyle === 'light' ? '&copy; CARTO' : '&copy; OpenStreetMap'
      });

      map.addLayer({
        'id': 'osm',
        'type': 'raster',
        'source': 'osm',
        'minzoom': 0,
        'maxzoom': 19
      }, 'unclustered-point-ripple' || undefined);

      styleBtn.classList.toggle('active', currentStyle === 'osm');
    });

    // Fix Race Condition: Start both map initialization and data fetch in parallel
    const mapLoadPromise = new Promise(resolve => {
      if (map.loaded()) resolve();
      else map.on('load', resolve);
    });

    const dataFetchPromise = fetch('/api/map_data').then(res => {
      if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
      return res.json();
    });

    // Wait for both to finish
    Promise.all([mapLoadPromise, dataFetchPromise])
      .then(([_, data]) => {
        console.log("Map and data ready. Rendering features...");

        // Hide loading overlay
        document.getElementById('loading').style.display = 'none';

        if (!data || data.length === 0) {
          console.warn("No data returned from API");
          return;
        }

        // Convert array of objects to GeoJSON
        const features = data.map(item => ({
          type: 'Feature',
          geometry: {
            type: 'Point',
            coordinates: [item.lon, item.lat]
          },
          properties: item
        }));

        const geojson = {
          type: 'FeatureCollection',
          features: features
        };

        // Add source and layers
        map.addSource('predictions', {
          type: 'geojson',
          data: geojson,
          cluster: true,
          clusterMaxZoom: 14,
          clusterRadius: 50
        });

        // Unclustered points
        map.addLayer({
          id: 'unclustered-point',
          type: 'circle',
          source: 'predictions',
          filter: ['!', ['has', 'point_count']],
          layout: {
            'circle-sort-key': [
              'case',
              ['==', ['get', 'status_cidade'], '🔴 Vermelho'], 3,
              ['==', ['get', 'status_cidade'], '🟡 Amarelo'], 2,
              1
            ]
          },
          paint: {
            'circle-color': ['get', 'cor_cidade'],
            'circle-radius': 8,
            'circle-stroke-width': 1.5,
            'circle-stroke-color': '#fff'
          }
        });

        // Clusters
        map.addLayer({
          id: 'clusters',
          type: 'circle',
          source: 'predictions',
          filter: ['has', 'point_count'],
          paint: {
            'circle-color': '#444',
            'circle-radius': [
              'step',
              ['get', 'point_count'],
              15,
              100,
              20,
              750,
              30
            ],
            'circle-stroke-width': 1,
            'circle-stroke-color': '#fff'
          }
        });

        // Cluster count
        map.addLayer({
          id: 'cluster-count',
          type: 'symbol',
          source: 'predictions',
          filter: ['has', 'point_count'],
          layout: {
            'text-field': '{point_count_abbreviated}',
            'text-size': 12
          },
          paint: {
            'text-color': '#fff'
          }
        });

        // Interactions
        map.on('mouseenter', 'unclustered-point', () => {
          map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'unclustered-point', () => {
          map.getCanvas().style.cursor = '';
        });

        map.on('click', 'unclustered-point', (e) => {
          const props = e.features[0].properties;
          showDetails(props);
        });

        map.on('mouseenter', 'clusters', () => {
          map.getCanvas().style.cursor = 'pointer';
        });
        map.on('mouseleave', 'clusters', () => {
          map.getCanvas().style.cursor = '';
        });

        // Click on cluster to zoom in
        map.on('click', 'clusters', (e) => {
          const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
          const clusterId = features[0].properties.cluster_id;
          map.getSource('predictions').getClusterExpansionZoom(
            clusterId,
            (err, zoom) => {
              if (err) return;
              map.easeTo({
                center: features[0].geometry.coordinates,
                zoom: zoom
              });
            }
          );
        });

        // Ripple Layer (Effect behind the points)
        map.addLayer({
          id: 'unclustered-point-ripple',
          type: 'circle',
          source: 'predictions',
          filter: ['!', ['has', 'point_count']],
          layout: {
            'circle-sort-key': [
              'case',
              ['==', ['get', 'status_cidade'], '🔴 Vermelho'], 3,
              ['==', ['get', 'status_cidade'], '🟡 Amarelo'], 2,
              1
            ]
          },
          paint: {
            'circle-color': ['get', 'cor_cidade'],
            'circle-radius': 8,
            'circle-opacity': 0
          }
        }, 'unclustered-point');

        // Start Ripple Animation
        animateRipple();
      })
      .catch(err => {
        console.error("Error loading map or data:", err);
        document.getElementById('loading').innerHTML = `
          <div style="color: #E74C3C; padding: 20px; text-align: center;">
            <strong>Erro ao carregar dados</strong><br>
            <span style="font-size: 13px;">${err.message}</span><br>
            <button onclick="location.reload()" style="margin-top: 10px; padding: 5px 10px;">Tentar Novamente</button>
          </div>
        `;
      });

    // Ripple Animation Logic (Ondas)
    function animateRipple() {
      if (!map.getLayer('unclustered-point-ripple')) return;

      const duration = 2000;
      const t = (performance.now() % duration) / duration;

      const redRadius = 8 + (25 * t);
      const yellowRadius = 8 + (12 * t);

      const redOpacity = 0.6 * (1 - t);
      const yellowOpacity = 0.4 * (1 - t);

      map.setPaintProperty('unclustered-point-ripple', 'circle-radius', [
        'case',
        ['==', ['get', 'status_cidade'], '🔴 Vermelho'], redRadius,
        ['==', ['get', 'status_cidade'], '🟡 Amarelo'], yellowRadius,
        0
      ]);

      map.setPaintProperty('unclustered-point-ripple', 'circle-opacity', [
        'case',
        ['==', ['get', 'status_cidade'], '🔴 Vermelho'], redOpacity,
        ['==', ['get', 'status_cidade'], '🟡 Amarelo'], yellowOpacity,
        0
      ]);

      requestAnimationFrame(animateRipple);
    }

    function showDetails(props) {
      const panel = document.getElementById('info-panel');
      const probAtraso = (props.max_probabilidade * 100).toFixed(1) + '%';

      const formatNum = (num) => {
        const n = Number(num);
        return isNaN(n) ? '-' : n.toFixed(1);
      };

      const formatDate = (dateStr, includeTime = false) => {
        if (!dateStr || dateStr === '-') return '-';
        const parts = dateStr.split(' ');
        const datePart = parts[0];
        const timePart = parts[1] ? parts[1].substring(0, 5) : ''; // HH:mm

        const dParts = datePart.split('-');
        if (dParts.length === 3) {
          const formattedDate = `${dParts[2]}/${dParts[1]}/${dParts[0]}`;
          return includeTime && timePart ? `${formattedDate} ${timePart}` : formattedDate;
        }
        return dateStr;
      };

      // SHAP HTML generation
      let shapHtml = '';
      if (props.pior_shap_columns && props.pior_shap_values) {
        const cols = props.pior_shap_columns.split('|');
        const vals = props.pior_shap_values.split('|').map(Number);

        // Find max absolute value to scale the bars
        const maxVal = Math.max(...vals.map(Math.abs));

        let barsHtml = '';
        for (let i = 0; i < cols.length; i++) {
          if (!cols[i]) continue;

          const val = vals[i];
          const pct = maxVal > 0 ? (Math.abs(val) / maxVal) * 100 : 0;
          const color = val > 0 ? '#ff7f0e' : '#1f77b4'; // Orange for delay, Blue for early
          const sign = val > 0 ? '+' : '';

          barsHtml += `
            <div style="margin-top: 8px;">
              <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 2px;">
                <span>${cols[i]}</span>
                <span style="color: ${color}; font-weight: bold;">${sign}${val.toFixed(3)}</span>
              </div>
              <div style="background: #eee; height: 6px; border-radius: 3px; width: 100%;">
                <div style="background: ${color}; height: 100%; width: ${pct}%; border-radius: 3px;"></div>
              </div>
            </div>
          `;
        }

        if (barsHtml) {
          shapHtml = `
            <h3 style="font-size: 14px; margin: 20px 0 10px 0; color: #555;">Principais Fatores de Risco (SHAP):</h3>
            <div style="background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ddd;">
              ${barsHtml}
            </div>
          `;
        }
      }

      panel.innerHTML = `
        <h2 class="info-title">📍Destino: ${props.cidade_destinatario} - ${props.uf}</h2>
        <ul class="info-list">
          <li style="border-color: ${props.cor_cidade}">
            <strong>Status Geral da Cidade</strong>
            <span>${props.status_cidade}</span>
          </li>
          <li style="border-color: #ccc">
            <strong>Total de Pedidos</strong>
            <span>${props.total_pedidos}</span>
          </li>
          <li style="border-color: #ccc">
            <strong>Distribuição de Risco</strong>
            <span style="font-size: 13px;">
              🟢 Verde: ${props.qtd_verde} <br>
              🟡 Amarelo: ${props.qtd_amarelo} <br>
              🔴 Vermelho: ${props.qtd_vermelho}
            </span>
          </li>
        </ul>
        
        <h3 style="font-size: 16px; margin: 20px 0 10px 0;">Maior Risco de Atraso:</h3>
        <ul class="info-list">
          <li style="border-color: ${props.pior_cor}">
            <strong>Pedido</strong>
            <span>#${props.pior_pedido_id}</span>
          </li>
          <li style="border-color: ${props.pior_cor}">
            <strong>Risco (Prob. de Atraso)</strong>
            <span>${props.pior_risco_nome} (${probAtraso})</span>
          </li>
          <li style="border-color: #ccc">
            <strong>Transportadora Principal</strong>
            <span>${props.pior_transportadora}</span>
          </li>
          <li style="border-color: #ccc">
            <strong>Origem (CD)</strong>
            <span>${props.pior_cd_origem}</span>
          </li>
          <li style="border-color: #ccc">
            <strong>Data Despacho</strong>
            <span>${formatDate(props.pior_dt_despacho, true)}</span>
          </li>
          <li style="border-color: #ccc">
            <strong>Previsão de Entrega</strong>
            <span>${formatDate(props.pior_dt_previsao)}</span>
          </li>
        </ul>
        ${shapHtml}
      `;
    }
  </script>
</body>

</html>
