<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Risk Map Dashboard</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      overflow: hidden;
    }

    /* ============== HEADER ============== */
    header {
      width: 100%;
      background: #000;
      color: #fff;
      padding: 20px 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 80px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
    }

    .btn-nav {
      color: #000;
      background: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn-nav:hover {
      background: #e0e0e0;
    }

    /* ============== MAIN CONTENT ============== */
    .container {
      display: flex;
      height: calc(100vh - 80px);
      width: 100%;
    }

    .map-container {
      flex: 0 0 70%;
      height: 100%;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .info-panel {
      flex: 0 0 30%;
      height: 100%;
      background: #fff;
      border-left: 1px solid #ddd;
      overflow-y: auto;
      padding: 24px;
      box-shadow: -2px 0 8px rgba(0,0,0,0.05);
    }

    .info-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #000;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }

    .empty-state {
      text-align: center;
      color: #999;
      margin-top: 50px;
      font-size: 15px;
    }

    .info-list {
      list-style: none;
    }

    .info-list li {
      margin-bottom: 16px;
      background: #f9f9f9;
      padding: 12px 16px;
      border-radius: 4px;
      border-left: 4px solid #ccc;
    }

    .info-list li strong {
      display: block;
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .info-list li span {
      font-size: 15px;
      font-weight: 500;
      color: #111;
      word-break: break-word;
    }

    /* Legend */
    .legend {
      position: absolute;
      bottom: 30px;
      right: 20px;
      background: white;
      padding: 12px 16px;
      border-radius: 4px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    .legend-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .legend-item:last-child {
      margin-bottom: 0;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-right: 10px;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.8);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #333;
    }
    .spinner {
      width: 30px; height: 30px;
      border: 3px solid #ddd;
      border-top-color: #000;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mapa de Risco Logístico</h1>
    <a href="/" class="btn-nav">Dashboard em Tabela</a>
  </header>

  <div class="container">
    <div class="map-container">
      <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <div>Carregando pontos no mapa...</div>
      </div>
      <div id="map"></div>
      <div class="legend">
        <div class="legend-title">Nível de Risco</div>
        <div class="legend-item">
          <div class="legend-color" style="background:#2ECC71;"></div>
          Verde (&lt; 30%)
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background:#F1C40F;"></div>
          Amarelo (30 - 70%)
        </div>
        <div class="legend-item">
          <div class="legend-color" style="background:#E74C3C;"></div>
          Vermelho (&gt; 70%)
        </div>
      </div>
    </div>
    
    <div class="info-panel" id="info-panel">
      <h2 class="info-title">Detalhes do Pedido</h2>
      <div class="empty-state">
        <p>Clique em um ponto no mapa para visualizar as informações completas.</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script>
    // Initialize MapLibre Map
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        'version': 8,
        'sources': {
          'osm': {
            'type': 'raster',
            'tiles': [
              'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
            ],
            'tileSize': 256,
            'attribution': '&copy; OpenStreetMap Contributors'
          }
        },
        'layers': [
          {
            'id': 'osm',
            'type': 'raster',
            'source': 'osm',
            'minzoom': 0,
            'maxzoom': 19
          }
        ]
      },
      center: [-51.9253, -14.2350], // Approximate center of Brazil
      zoom: 3.5
    });

    map.addControl(new maplibregl.NavigationControl());

    // Load data from backend
    fetch('/api/map_data')
      .then(res => res.json())
      .then(data => {
        // Convert array of objects to GeoJSON
        const features = data.map(item => ({
          type: 'Feature',
          geometry: {
            type: 'Point',
            coordinates: [item.lon, item.lat]
          },
          properties: item
        }));

        const geojson = {
          type: 'FeatureCollection',
          features: features
        };

        map.on('load', () => {
          // Hide loading overlay
          document.getElementById('loading').style.display = 'none';

          map.addSource('predictions', {
            type: 'geojson',
            data: geojson,
            cluster: true,
            clusterMaxZoom: 14,
            clusterRadius: 50
          });

          // Unclustered points
          map.addLayer({
            id: 'unclustered-point',
            type: 'circle',
            source: 'predictions',
            filter: ['!', ['has', 'point_count']],
            paint: {
              'circle-color': ['get', 'cor_cidade'],
              'circle-radius': 6,
              'circle-stroke-width': 1,
              'circle-stroke-color': '#fff'
            }
          });

          // Clusters
          map.addLayer({
            id: 'clusters',
            type: 'circle',
            source: 'predictions',
            filter: ['has', 'point_count'],
            paint: {
              'circle-color': '#444',
              'circle-radius': [
                'step',
                ['get', 'point_count'],
                15,
                100,
                20,
                750,
                30
              ],
              'circle-stroke-width': 1,
              'circle-stroke-color': '#fff'
            }
          });

          // Cluster count
          map.addLayer({
            id: 'cluster-count',
            type: 'symbol',
            source: 'predictions',
            filter: ['has', 'point_count'],
            layout: {
              'text-field': '{point_count_abbreviated}',
              'text-font': ['Open Sans Regular'], // MapLibre default fallback
              'text-size': 12
            },
            paint: {
              'text-color': '#fff'
            }
          });

          // Interactions
          map.on('mouseenter', 'unclustered-point', () => {
            map.getCanvas().style.cursor = 'pointer';
          });
          map.on('mouseleave', 'unclustered-point', () => {
            map.getCanvas().style.cursor = '';
          });

          map.on('click', 'unclustered-point', (e) => {
            const props = e.features[0].properties;
            showDetails(props);
          });
          
          map.on('mouseenter', 'clusters', () => {
            map.getCanvas().style.cursor = 'pointer';
          });
          map.on('mouseleave', 'clusters', () => {
            map.getCanvas().style.cursor = '';
          });

          // Click on cluster to zoom in
          map.on('click', 'clusters', (e) => {
            const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
            const clusterId = features[0].properties.cluster_id;
            map.getSource('predictions').getClusterExpansionZoom(
              clusterId,
              (err, zoom) => {
                if (err) return;
                map.easeTo({
                  center: features[0].geometry.coordinates,
                  zoom: zoom
                });
              }
            );
          });
        });
      })
      .catch(err => {
        console.error("Error loading map data:", err);
        document.getElementById('loading').innerHTML = "<div>Erro ao carregar dados.</div>";
      });

    function showDetails(props) {
      const panel = document.getElementById('info-panel');
      const probAtraso = (props.max_probabilidade * 100).toFixed(1) + '%';
      
      const formatNum = (num) => {
        const n = Number(num);
        return isNaN(n) ? '-' : n.toFixed(1);
      };

      panel.innerHTML = `
        <h2 class="info-title">📍 ${props.cidade_destinatario} - ${props.uf}</h2>
        <ul class="info-list">
          <li style="border-color: ${props.cor_cidade}">
            <strong>Status Geral da Cidade</strong>
            <span>${props.status_cidade}</span>
          </li>
          <li style="border-color: #ccc">
            <strong>Total de Pedidos</strong>
            <span>${props.total_pedidos}</span>
          </li>
          <li style="border-color: #ccc">
            <strong>Distribuição de Risco</strong>
            <span style="font-size: 13px;">
              🟢 Verde: ${props.qtd_verde} <br>
              🟡 Amarelo: ${props.qtd_amarelo} <br>
              🔴 Vermelho: ${props.qtd_vermelho}
            </span>
          </li>
        </ul>
        
        <h3 style="font-size: 16px; margin: 20px 0 10px 0;">Pior Pedido Encontrado:</h3>
        <ul class="info-list">
          <li style="border-color: ${props.pior_cor}">
            <strong>Pedido</strong>
            <span>#${props.pior_pedido_id}</span>
          </li>
          <li style="border-color: ${props.pior_cor}">
            <strong>Risco (Prob. de Atraso)</strong>
            <span>${props.pior_risco_nome} (${probAtraso})</span>
          </li>
          <li style="border-color: #ccc">
            <strong>Transportadora Principal</strong>
            <span>${props.pior_transportadora}</span>
          </li>
          <li style="border-color: #ccc">
            <strong>Origem (CD)</strong>
            <span>${props.pior_cd_origem}</span>
          </li>
          <li style="border-color: #ccc">
            <strong>Margem de Entrega</strong>
            <span>${formatNum(props.pior_margem)} dias</span>
          </li>
        </ul>
      `;
    }
  </script>
</body>
</html>
